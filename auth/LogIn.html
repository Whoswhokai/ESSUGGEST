<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/jpg" href="../assets/LOGO.png" />
    <title>ESSUGGEST</title>
    <link rel="stylesheet" href="../src/output.css" />
    <link rel="stylesheet" href="../src/validation.css" />
  </head>
  <body
    class="flex justify-center items-center min-h-screen bg-gray-200 px-4 sm:px-6 md:px-0"
  >
    <div class="w-110 h-130 bg-white rounded-2xl md:rounded-r-none shadow-2xl">
      <h1 class="text-center text-4xl font-poppins font-black mt-20">
        WELCOME
      </h1>
      <p
        class="text-center text-sm opacity-50 mb-6 font-thin italic font-jakarta"
      >
        Log in to your account
      </p>

      <form
        class="flex justify-center items-center flex-col space-y-1"
        onsubmit="Login(event)"
      >
        <div class="w-90 mb-2.5">
          <label for="" class="px-3 font-dm">Email</label>
          <input
            type="email"
            id="email"
            placeholder="JuanDelaCruz@gmail.com"
            class="border border-gray-200 bg-gray-100 w-full py-2 rounded-md px-3 focus:ring-green-400 focus:outline-none focus:ring-2 font-dm text-xm"
          />
        </div>

        <div class="w-90">
          <label for="" class="px-3 font-dm">Password</label>
          <div class="relative">
            <input
              type="password"
              id="password"
              placeholder="•••••••••••••"
              class="border border-gray-200 bg-gray-100 w-full py-2 rounded-md px-3 focus:ring-green-400 focus:outline-none focus:ring-2 font-dm mb-1 text-xm"
            />

            <svg
              id="eyecon"
              onclick="eye(event)"
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="size-6 absolute right-3 top-1/2 -translate-y-1/2 cursor-pointer"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m3.228 3.228 3.65 3.65m7.894 7.894L21 21m-3.228-3.228-3.65-3.65m0 0a3 3 0 1 0-4.243-4.243m4.242 4.242L9.88 9.88"
              />
            </svg>
          </div>
        </div>

        <div class="flex justify-between mb-6 w-90">
          <label class="text-sm font-dm flex items-center gap-1.5">
            <input type="checkbox" class="accent-green-700" />
            Remember me
          </label>

          <a
            class="text-sm font-dm hover:underline transition- duration-300"
            href="#"
            >Forgot password?</a
          >
        </div>

        <p id="message" class="font-dm font-light h-5"></p>

        <div class="flex justify-center items-center">
          <button
            id="submit"
            type="submit"
            class="bg-green-600 text-white w-90 h-10 rounded-md hover:bg-green-700 transition duration-300 font-poppins text-md font-bold"
          >
            Log In
          </button>
        </div>
        <p class="text-center font-dm text-sm mb-10">
          Don't have an account?

          <a class="text-blue-500" href="../auth/SignUp.html">Sign up here.</a>
        </p>

        <p class="text-center text-sm font-dm">© 2026</p>
      </form>
    </div>

    <div
      class="bg-black w-110 h-130 rounded-r-2xl relative p-3.5 shadow-2xl md:block hidden"
    >
      <video
        autoplay
        muted
        loop
        class="w-100 absolute rounded-2xl top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2"
      >
        <source src="/assets/ESSUGEST VIDEO.mp4" />
        <source src="/assets/ESSUGEST VIDEO.webm" />
      </video>
    </div>
    <script type="module" src="../auth/Login.js" defer></script>

    <!--kaiser was here-->
    
  </body>
</html>
